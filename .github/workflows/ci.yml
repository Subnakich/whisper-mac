name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test runner
        run: python -m pip install "pytest>=8.3,<9"

      - name: Test Python pipeline
        run: PYTHONPATH=cli/src python -m pytest cli/tests -q

      - name: Build local package
        run: ./scripts/build_pkg.sh

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: WhisperMac-package
          path: build/*.pkg
          if-no-files-found: error

